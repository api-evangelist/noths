aid: noths
name: NOTHS
description: 'NOTHS (Not On The High Street, notonthehighstreet.com) is a UK online
  marketplace that curates and sells unique gifts, jewellery, homeware and personalised
  products made or sourced by thousands of small UK creative businesses. Founded in
  2006 and backed by Index Ventures, the platform connects independent sellers ("partners")
  with consumers through a curated storefront, seller onboarding, and an affiliate
  programme. It exposes no public developer API, OpenAPI, SDK, or documentation surface;
  its api.notonthehighstreet.com host is a private backend serving the company''s own
  web and mobile storefront. This profile is a VC-portfolio lead enriched by the API
  Evangelist pipeline via live domain/security probing.'
